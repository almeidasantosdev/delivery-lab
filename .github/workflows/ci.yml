name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: delivery-lab:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: delivery-lab:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Formato
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Validar
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  sonar:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Verificar segredo SONAR_TOKEN
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Segredo SONAR_TOKEN ausente. A analise do SonarCloud fica de fora desta execucao e volta a rodar quando o segredo existir."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8.5.0
        if: steps.gate.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Vulnerabilidade alta interrompe a entrega
        if: steps.gate.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: almeidasantosdev_delivery-lab
        run: bash scripts/sonar-gate.sh

  deliver:
    needs: [test, image, secrets, terraform, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Entrega liberada
        env:
          SONAR_ENABLED: ${{ needs.sonar.outputs.enabled }}
        run: |
          if [ "${SONAR_ENABLED}" = "true" ]; then
            echo "Testes, imagem, segredos, Terraform e SonarCloud passaram. A publicacao da imagem continua desligada de proposito."
          else
            echo "Testes, imagem, segredos e Terraform passaram. O SonarCloud nao rodou porque o segredo SONAR_TOKEN nao esta configurado. A publicacao da imagem continua desligada de proposito."
          fi
